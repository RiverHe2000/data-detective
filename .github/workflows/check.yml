name: Check local application
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev-windows.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/verify.py --out reports/ci-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: reports/ci-verification/
