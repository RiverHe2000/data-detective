name: Check local application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create an isolated verification environment
        run: python -m venv .venv
      - name: Install the frozen dependencies and this checkout
        run: |
          .venv\Scripts\python.exe -m pip install -r requirements-dev-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip install --no-deps -e .
      - name: Verify installed package, dependency closure, tests and frozen cases
        run: .venv\Scripts\python.exe scripts/verify.py --out reports/ci-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: reports/ci-verification/
