[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-detective"
version = "0.1.0"
description = "Investigate sales anomalies, preview repairs, and preserve the evidence."
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "streamlit>=1.64,<1.65", "plotly>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "openpyxl>=3.1,<4", "requests>=2.32,<3"]
model = ["torch==2.11.0", "transformers==5.16.1", "accelerate==1.14.0"]

[project.scripts]
data-detective = "data_detective.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires local model weights and GPU", "performance: local performance measurements"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
